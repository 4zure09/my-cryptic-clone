name: Daily support sync

on:
  schedule:
    - cron: "17 19 * * *" # 02:17 Asia/Saigon (UTC+7)
  workflow_dispatch:
    inputs:
      article_limit:
        description: "0 = all published articles; use 40 for a quick test"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: daily-support-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VECTOR_STORE_ID: ${{ vars.OPENAI_VECTOR_STORE_ID }}
      ASSISTANT_ID: ${{ vars.ASSISTANT_ID }}
      OPENAI_VECTOR_STORE_NAME: opb-store
      UPLOAD_ENABLED: "true"
      ARTICLE_LIMIT: ${{ inputs.article_limit || '0' }}
      DATA_DIR: data/articles
      STATE_FILE: state/articles.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore durable ingestion state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/articles
            state
          key: support-state-${{ github.run_id }}
          restore-keys: support-state-

      - name: Install
        run: python -m pip install .

      - name: Scrape and upload delta
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          python main.py 2>&1 | tee logs/last-run.log

      - name: Save durable ingestion state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/articles
            state
          key: support-state-${{ github.run_id }}

      - name: Publish last-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-${{ github.run_id }}
          path: logs/last-run.log
          if-no-files-found: warn
          retention-days: 30
