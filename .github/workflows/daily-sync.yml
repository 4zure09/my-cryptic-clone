name: Daily support sync

on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "0 = all published articles; use 40 for a quick test"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: daily-support-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VECTOR_STORE_NAME: cryptic-optibot-kb
      UPLOAD_ENABLED: "true"
      ARTICLE_LIMIT: ${{ inputs.article_limit || '0' }}
      DATA_DIR: .runtime/articles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Scrape and upload delta
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          python main.py 2>&1 | tee logs/last-run.log

      - name: Publish last-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-${{ github.run_id }}
          path: logs/last-run.log
          if-no-files-found: warn
          retention-days: 30
