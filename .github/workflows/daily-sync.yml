name: Daily support sync

on:
  schedule:
    # 07:30 UTC = 14:30 Vietnam (UTC+7).
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "0 = all published articles; use 40 for a quick test"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: daily-support-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VECTOR_STORE_ID: ${{ vars.OPENAI_VECTOR_STORE_ID }}
      OPENAI_VECTOR_STORE_NAME: cryptic-optibot-kb
      UPLOAD_ENABLED: "true"
      ARTICLE_LIMIT: ${{ github.event.inputs.article_limit || '0' }}
      DATA_DIR: .runtime/articles

    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAI configuration
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Set the repository secret OPENAI_API_KEY before running this workflow."
            exit 1
          fi
          if [[ -z "$OPENAI_VECTOR_STORE_ID" ]]; then
            echo "::error::Set the repository variable OPENAI_VECTOR_STORE_ID before running this workflow."
            exit 1
          fi

      - name: Restore runtime article cache
        uses: actions/cache@v4
        with:
          path: .runtime/articles
          key: article-data-${{ github.run_id }}
          restore-keys: |
            article-data-

      - name: Build Docker image
        run: docker build --tag daily-scraper .

      - name: Run scraper inside Docker
        shell: bash
        run: |
          mkdir -p logs .runtime/articles
          set -o pipefail
          docker run --rm \
            --env OPENAI_API_KEY \
            --env OPENAI_VECTOR_STORE_ID \
            --env OPENAI_VECTOR_STORE_NAME \
            --env UPLOAD_ENABLED \
            --env ARTICLE_LIMIT \
            --env DATA_DIR \
            --volume "${{ github.workspace }}/logs:/app/logs" \
            --volume "${{ github.workspace }}/.runtime/articles:/app/.runtime/articles" \
            daily-scraper main.py 2>&1 | tee logs/last-run.log

      - name: Publish last-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-${{ github.run_id }}
          path: logs/last-run.log
          if-no-files-found: warn
          retention-days: 30
